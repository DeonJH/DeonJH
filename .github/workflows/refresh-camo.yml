name: Refresh Camo cache

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Discover and PURGE camo URLs in profile README
        shell: bash
        run: |
          set -uo pipefail
          urls=$(curl -sLk "https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/tree/main" \
            | grep -Eo "https://camo\.githubusercontent\.com[a-zA-Z0-9./?=_%:-]*" \
            | sort -u)
          if [ -z "$urls" ]; then echo "No camo URLs found"; exit 0; fi
          echo "$urls" | while IFS= read -r url; do
            echo "Purging $url"
            curl -sS -X PURGE "$url" || true
          done
