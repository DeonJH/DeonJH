<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Deon Hill — Software that ships, scales and is maintainable.">
  <defs>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(45 0.5 0.5)">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="#f9fafb"/>
  <ellipse cx="600" cy="160" rx="520" ry="180" fill="url(#glow)"/>

  <text x="600" y="172" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="76" letter-spacing="-1.5" fill="url(#emerald)">Deon Hill</text>
  <text x="600" y="220" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="26" fill="#374151">Software that ships, scales and is maintainable.</text>
  <line x1="550" y1="240" x2="650" y2="240" stroke="url(#emerald)" stroke-width="3" stroke-linecap="round"/>
</svg>
